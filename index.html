<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowdCraft Studio</title><style>body{margin:0;background:#0c1020;color:#eaf0ff;font:15px system-ui}header{padding:20px 28px;border-bottom:1px solid #29324a;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:22px}section{background:#151c30;border:1px solid #303a55;border-radius:14px;padding:16px}textarea{width:100%;height:55vh;box-sizing:border-box;resize:vertical;background:#090e1b;color:#c9e5ff;border:1px solid #3b4a68;border-radius:8px;padding:14px;font:13px ui-monospace,monospace}iframe{background:white;width:100%;height:55vh;border:0;border-radius:8px}button{background:#4869ef;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;margin:3px}button:focus-visible{outline:3px solid #fff}small{color:#a9b7d6}@media(max-width:800px){main{grid-template-columns:1fr}textarea,iframe{height:38vh}}</style></head><body><header><div><strong>CrowdCraft</strong><br><small>Local prototype • changes saved in this browser</small></div><div><button id="reset">Reset</button><button id="export">Export HTML</button></div></header><main><section><h2>Source editor</h2><p><small>Edit HTML, CSS and JavaScript. Press Ctrl/Cmd+S to save a snapshot.</small></p><textarea id="source" spellcheck="false" aria-label="Source code editor"></textarea><p id="status" role="status"></p></section><section><h2>Live preview</h2><iframe id="preview" title="Sandboxed project preview" sandbox="allow-scripts"></iframe><p><small>Preview is sandboxed and cannot access this studio's browser storage.</small></p></section></main><script>const KEY="crowdcraft-editor",source=document.getElementById("source"),frame=document.getElementById("preview"),status=document.getElementById("status");const starter="<!doctype html><html><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Star Catcher</title><style>body{margin:0;background:#10182e;color:white;text-align:center;font:16px system-ui}canvas{max-width:95vw;background:#192747;border-radius:12px;touch-action:none}button{padding:10px}</style><h1>Star Catcher</h1><p>Move with arrow keys, WASD or pointer • Score: <b id=\"score\">0</b></p><canvas id=\"game\" width=\"520\" height=\"340\"></canvas><p><button id=\"restart\">Restart</button></p><script>const c=document.getElementById('game'),g=c.getContext('2d'),score=document.getElementById('score');let p={x:260,y:170},star={x:100,y:100},n=0,keys=new Set;function restart(){p={x:260,y:170};n=0;score.textContent=n;place()}function place(){star={x:15+Math.random()*490,y:15+Math.random()*310}}document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('pointermove',e=>{if(e.buttons){const r=c.getBoundingClientRect();p.x=(e.clientX-r.left)*c.width/r.width;p.y=(e.clientY-r.top)*c.height/r.height}});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();p.x=(e.clientX-r.left)*c.width/r.width;p.y=(e.clientY-r.top)*c.height/r.height});document.getElementById('restart').onclick=restart;function tick(){const dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));p.x=Math.max(12,Math.min(508,p.x+dx*3));p.y=Math.max(12,Math.min(328,p.y+dy*3));if(Math.hypot(p.x-star.x,p.y-star.y)<23){score.textContent=++n;place()}g.clearRect(0,0,520,340);g.fillStyle='#f8cf59';g.beginPath();g.arc(star.x,star.y,10,0,Math.PI*2);g.fill();g.fillStyle='#73ddf3';g.beginPath();g.arc(p.x,p.y,13,0,Math.PI*2);g.fill();requestAnimationFrame(tick)}tick();<\\/script></html>";let timer;try{source.value=localStorage.getItem(KEY)||starter}catch{source.value=starter}function render(){const policy='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data: blob:; connect-src \'none\'; form-action \'none\'; base-uri \'none\'">';frame.srcdoc=policy+source.value;status.textContent="Preview updated"}function save(){try{localStorage.setItem(KEY,source.value);status.textContent="Saved locally"}catch{status.textContent="Browser storage unavailable; export your work"}}source.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{save();render()},350)});document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}});document.getElementById("reset").onclick=()=>{if(confirm("Replace current source with the starter template?")){source.value=starter;save();render()}};document.getElementById("export").onclick=()=>{const url=URL.createObjectURL(new Blob([source.value],{type:"text/html"}));const a=document.createElement("a");a.href=url;a.download="crowdcraft-game.html";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></body></html>
