name: Validate browser studio
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and syntax checks
        run: node --test tests/studio.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          node node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - name: Browser regression tests (${{ matrix.browser }})
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: node --test tests/browser.test.cjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ matrix.browser }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
