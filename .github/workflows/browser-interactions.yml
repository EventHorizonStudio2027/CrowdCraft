name: Browser interaction regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: browser-interactions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.58.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        run: npx playwright test tests/core.spec.cjs --project=${{ matrix.browser }} --reporter=line
