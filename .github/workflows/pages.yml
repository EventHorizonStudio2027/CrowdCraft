name: Publish CrowdCraft to GitHub Pages
on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/studio.test.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: crowdcraft-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate studio before publishing
        run: node --test tests/studio.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'id="inspector-undo"' _site/index.html
          test -s _site/assets/logo.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live published HTML
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 --header 'Cache-Control: no-cache' "${PAGE_URL}?revision=${GITHUB_SHA}" -o /tmp/crowdcraft-live.html && grep -q 'CrowdCraft Studio' /tmp/crowdcraft-live.html && grep -q 'id="inspector-next"' /tmp/crowdcraft-live.html && grep -q 'id="inspector-undo"' /tmp/crowdcraft-live.html; then
              echo "Published site responds with current editor: ${PAGE_URL}"
              exit 0
            fi
            sleep 10
          done
          echo 'Live site failed verification.' >&2
          exit 1
