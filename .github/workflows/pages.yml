name: Publish CrowdCraft to GitHub Pages
on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'apple-touch-icon.png'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'tests/studio.test.cjs'
      - 'tests/browser.test.cjs'
      - 'tests/studio-contract.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: crowdcraft-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate studio before publishing
        run: node --test tests/studio.test.cjs tests/studio-contract.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Run Chromium browser regression suite
        run: |
          BROWSER_ENGINE=chromium node --test tests/browser.test.cjs
          BROWSER_ENGINE=webkit node --test tests/browser.test.cjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure
          path: test-artifacts/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html apple-touch-icon.png manifest.webmanifest _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          test -s _site/index.html
          grep -qi '<!doctype html>' _site/index.html
          grep -q 'id="studio-view"' _site/index.html
          grep -q 'id="project-save"' _site/index.html
          echo 'Root index.html and primary studio controls are present in the deployment artifact.'
          grep -q 'id="inspector-undo"' _site/index.html
          test -s _site/assets/branding/crowdcraft-app-icon.png
          test -s _site/assets/branding/crowdcraft-wordmark.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed page and branding match this revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          matches_release() {
            local path="$1"
            curl --fail --silent --show-error --location --max-time 15 \
              --header 'Cache-Control: no-cache' "${base_url}/${path}?revision=${GITHUB_SHA}" \
              -o /tmp/pages-verification && cmp -s "_site/${path}" /tmp/pages-verification
          }
          for attempt in $(seq 1 12); do
            if matches_release index.html && matches_release apple-touch-icon.png && matches_release manifest.webmanifest && matches_release assets/branding/crowdcraft-app-icon.png && matches_release assets/branding/crowdcraft-wordmark.png; then
              echo "Live site and branding verified at ${PAGE_URL}"
              exit 0
            fi
            echo "Waiting for the published revision (attempt ${attempt}/12)"
            sleep 10
          done
          echo 'The published page or artwork did not match the deployed revision.' >&2
          exit 1
