name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing regression suite
        run: |
          for test_file in tests/*.test.cjs; do
            if [ "$test_file" != "tests/browser.test.cjs" ]; then
              node --test "$test_file" || exit 1
            fi
          done
